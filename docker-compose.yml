services:
  proxy:
    build: .
    ports:
      - "${PROXY_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
